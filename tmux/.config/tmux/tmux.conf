# Colors: kitty supports true colors

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB,xterm-256color:RGB"

set -g mouse on              # click panes, scroll with the wheel
set -g base-index 1          # windows start at 1 (easier to reach on the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on   # no gaps after closing a window
set -g history-limit 50000   # more scrollback
set -sg escape-time 10       # no delay after Esc (matters in Neovim, LAB-015)
set -g mode-keys vi          # vi keys in copy mode


# Splits that are easy to remember, opening in the current folder
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload this file with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

