# LAB-004: key-only SSH.
# # Files here are read in name order, and for most opetions sshd keeps the FIRST
# value it sees, so "10-" wins over Arch's "99-archlinux.conf".
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers Yongjanes
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
