general {
    lock_cmd = pidof hyprlock || hyprlock       # only ever one lock screen
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 2 min idle: lock (goes through lock_cmd, so no duplicate lockers)
listener {
    timeout = 120
    on-timeout = loginctl lock-session
}

# Screen off a few seconds after locking (laptop stays awake, so the homelab VM keeps running)
listener {
    timeout = 125
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
