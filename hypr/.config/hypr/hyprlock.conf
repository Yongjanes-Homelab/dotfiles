# Colours + wallpaper path come from pywal: ~/.config/wal/templates/colors-hyprlock.conf
source = ~/.cache/wal/colors-hyprlock.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $fg
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    check_color = $accent
    fail_color = $err
    placeholder_text = <i>password</i>
    fade_on_empty = false
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}
