general {
    # Determines if hyprlauncher takes full keyboard focus when opened
    grab_focus = true
}

cache {
    # Caches frequently used entries for quicker access
    enabled = true
}

finders {
    # Default fincder mode (e.g., desktop apps)
    default_finder = desktop

    # Toggle desktop icons in the search results
    desktop_icons = true
  
    # Prefix used to trigger the built-in math parser/calculator
    math_prefix = =

    #Removes initial workspace tokens if apps launch on the wrong monitor/workspace
    desktop_launch_prefix = env -u HL_INITIAL_WORKSPACE_TOKEN
}

ui {
    # Adjusts the width and height dimensions of the launcher window
    window_size = 640 420
}
