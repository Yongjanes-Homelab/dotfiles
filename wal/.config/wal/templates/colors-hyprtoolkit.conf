text = rgba({foreground.strip}ff)
bright_text = rgba(ffffffff)
accent = rgba({color4.strip}ff)
accent_secondary = rgba({color6.strip}ff)

font_family = JetBrainsMono Nerd Font
icon_theme = breeze-dark
h1_size = 20
h2_size = 15
h3_size = 13
font_size = 12
small_font_size = 10
rounding_large = 16
rounding_small = 10
